# Keep request URLs, query strings, headers and upstream diagnostics out of ingress logs.
log_format borecount_safe escape=json '{"requestId":"$request_id","status":$status,"durationSeconds":$request_time}';

server {
  listen 10000;
  server_name _;
  server_tokens off;
  # Match the maximum supported REQUEST_BODY_MAX_BYTES; the API may set a lower limit.
  client_max_body_size 1048576;
  error_page 413 = @payload_too_large;
  access_log /dev/stdout borecount_safe;
  # Native error messages can embed the full request URL. Safe status events above
  # remain available; operators may add a separately reviewed sanitizing collector.
  error_log /dev/null;

  root /app/apps/web/dist;
  index index.html;

  location @payload_too_large {
    default_type application/json;
    add_header X-Request-Id $request_id always;
    return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"Request body is too large"}';
  }

  location = /health {
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://127.0.0.1:3000/health;
  }

  location = /ready {
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://127.0.0.1:3000/ready;
  }

  location ~ ^/(demo|v1)(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(docs(/.*)?|openapi\.yaml|metrics)$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}

name: Build Render demo release
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build Render web/API
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.render
          push: true
          tags: ghcr.io/borecount/borecount-demo-render:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            VITE_PUBLIC_URL=${{ vars.PUBLIC_DEMO_URL || 'https://borecount.dev/' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build portable cleanup image
        id: cleanup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cleanup
          push: true
          tags: ghcr.io/borecount/borecount-demo-cleanup:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable release
        env:
          REVISION: ${{ github.sha }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CLEANUP_DIGEST: ${{ steps.cleanup.outputs.digest }}
        run: |
          printf 'revision=%s\nweb=ghcr.io/borecount/borecount-demo-render@%s\ncleanup=ghcr.io/borecount/borecount-demo-cleanup@%s\n' "$REVISION" "$WEB_DIGEST" "$CLEANUP_DIGEST" > public-release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: public-release
          path: public-release.txt

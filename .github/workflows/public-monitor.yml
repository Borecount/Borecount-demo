name: Public demo availability
on:
  schedule:
    - cron: '*/15 * * * *' # Liveness/static checks: no database queries.
    - cron: '17 8 * * *' # One daily database readiness/admission snapshot.
  workflow_dispatch:
    inputs:
      full_smoke:
        description: Create two disposable sandboxes and verify a posting
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: vars.PUBLIC_DEMO_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check liveness or explicit database readiness
        env:
          PUBLIC_DEMO_URL: ${{ vars.PUBLIC_DEMO_URL }}
          CHECK_SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_SMOKE: ${{ inputs.full_smoke }}
        run: |
          if [ "$FULL_SMOKE" = true ]; then
            node scripts/public-demo-smoke.mjs
          elif [ "$EVENT_NAME" = workflow_dispatch ] || [ "$CHECK_SCHEDULE" = "17 8 * * *" ]; then
            node scripts/public-demo-smoke.mjs --read-only
          else
            node scripts/public-demo-smoke.mjs --liveness
          fi
